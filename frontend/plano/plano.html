<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Plano</title>
    <link rel="stylesheet" href="plano.css">
</head>

<body onload="listar()">
    <header>
        <h1>🏋️ Sistema Academia</h1>
        <p>Gestão de planos, alunos e fichas de treino</p>
    </header>

    <nav>
        <a href="../menu/menu.html">Início</a>
        <a href="plano.html" class="ativo">Planos</a>
        <a href="../aluno/aluno.html">Alunos</a>
        <a href="../ficha/ficha_treino.html">Fichas de Treino</a>
    </nav>

    <main class="container-master">
        <div class="conteudo-principal">
            <section class="form-esquerda">
                <h2>Dados do Plano</h2>

                <label for="inputId_plano">Id do Plano</label>
                <div class="linha-id">
                    <input type="text" name="inputId_plano" id="inputId_plano" placeholder="Ex: 1">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_plano">Nome do Plano</label>
                <input type="text" name="inputNome_plano" id="inputNome_plano" placeholder="Ex: Mensal, Trimestral">

                <label for="inputValor_mensal">Valor Mensal (R$)</label>
                <input type="text" name="inputValor_mensal" id="inputValor_mensal" placeholder="Ex: 120.00">

                <div id="divAviso">Informe a Id do plano e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>
        </div>

        <section class="lista-planos">
            <h3>Planos Cadastrados</h3>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>

    <footer>
        <p>Thiago da Silva Scomparin</p>
        <p>Turma M32 — Segundo Ano</p>
        <p>&copy; 2026</p>
    </footer>

    <script src="./plano.js"></script>
</body>

</html>
